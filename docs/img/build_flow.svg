<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 192" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title>Build stages</title><style>
.o{fill:none;stroke:#f4e9dc;stroke-width:1.4}.t{fill:none;stroke:#ff9a3c;stroke-width:1.2}.h{fill:none;stroke:#b9a99a;stroke-width:1}
.d{stroke:#b9a99a;stroke-width:.8;fill:none}.dt{fill:#b9a99a;font-size:11px}.lb{fill:#f4e9dc;font-size:12px}.ti{fill:#f4e9dc;font-size:16px;font-weight:600}
.sm{fill:#b9a99a;font-size:10px}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9a99a"/></marker></defs><rect width="1064" height="192" rx="14" fill="#14110f"/><text class="ti" x="24" y="34">Build stages: each ends in PASS, FIX or STOP</text><rect x="24" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff9a3c" stroke-width="1.6"/><circle cx="44" cy="76" r="12" fill="#ff9a3c"/><text x="44" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">0</text><text x="34" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Fit coupons</text><text x="34" y="126" fill="#b9a99a" font-size="10.5">print, check</text><text x="34" y="139" fill="#b9a99a" font-size="10.5">tube, tap M2</text><path d="M129 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="138" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff9a3c" stroke-width="1.6"/><circle cx="158" cy="76" r="12" fill="#ff9a3c"/><text x="158" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">1</text><text x="148" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Low voltage</text><text x="148" y="126" fill="#b9a99a" font-size="10.5">12 V, polarity,</text><text x="148" y="139" fill="#b9a99a" font-size="10.5">V5</text><path d="M243 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="252" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff9a3c" stroke-width="1.6"/><circle cx="272" cy="76" r="12" fill="#ff9a3c"/><text x="272" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">2</text><text x="262" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Logic + RTC</text><text x="262" y="126" fill="#b9a99a" font-size="10.5">no HV module;</text><text x="262" y="139" fill="#b9a99a" font-size="10.5">fault latch</text><path d="M357 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="366" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ffd400" stroke-width="2.4"/><circle cx="386" cy="76" r="12" fill="#ffd400"/><text x="386" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">!</text><text x="376" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">HV gate</text><text x="376" y="126" fill="#b9a99a" font-size="10.5">experienced</text><text x="376" y="139" fill="#b9a99a" font-size="10.5">reviewer signs</text><path d="M471 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="480" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff5a3c" stroke-width="1.6"/><circle cx="500" cy="76" r="12" fill="#ff5a3c"/><text x="500" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">3</text><text x="490" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">HV supply</text><text x="490" y="126" fill="#b9a99a" font-size="10.5">170 V, measure</text><text x="490" y="139" fill="#b9a99a" font-size="10.5">discharge</text><path d="M585 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="594" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff5a3c" stroke-width="1.6"/><circle cx="614" cy="76" r="12" fill="#ff5a3c"/><text x="614" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">4</text><text x="604" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Tubes</text><text x="604" y="126" fill="#b9a99a" font-size="10.5">one digit, then</text><text x="604" y="139" fill="#b9a99a" font-size="10.5">all six</text><path d="M699 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="708" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff5a3c" stroke-width="1.6"/><circle cx="728" cy="76" r="12" fill="#ff5a3c"/><text x="728" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">5</text><text x="718" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Thermal</text><text x="718" y="126" fill="#b9a99a" font-size="10.5">2 h closed case</text><path d="M813 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="822" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff9a3c" stroke-width="1.6"/><circle cx="842" cy="76" r="12" fill="#ff9a3c"/><text x="842" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">6</text><text x="832" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Enclosure</text><text x="832" y="126" fill="#b9a99a" font-size="10.5">no HV visible</text><path d="M927 100.0h8" stroke="#b9a99a" stroke-width="1.5" marker-end="url(#ar)"/><rect x="936" y="54" width="104" height="92" rx="10" fill="#1f1915" stroke="#ff9a3c" stroke-width="1.6"/><circle cx="956" cy="76" r="12" fill="#ff9a3c"/><text x="956" y="81" fill="#14110f" font-size="13" font-weight="700" text-anchor="middle">7</text><text x="946" y="108" fill="#f4e9dc" font-size="12.5" font-weight="600">Record</text><text x="946" y="126" fill="#b9a99a" font-size="10.5">VALIDATION.md</text><rect x="24" y="162" width="14" height="12" rx="3" fill="#ff9a3c"/><text x="44" y="172" fill="#b9a99a" font-size="11.5">low voltage</text><rect x="170" y="162" width="14" height="12" rx="3" fill="#ff5a3c"/><text x="190" y="172" fill="#b9a99a" font-size="11.5">about 170 V present: guarded, measure before touching</text><rect x="560" y="162" width="14" height="12" rx="3" fill="#ffd400"/><text x="580" y="172" fill="#b9a99a" font-size="11.5">gate: nothing HV until signed</text></svg>