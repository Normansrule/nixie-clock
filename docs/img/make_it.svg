<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 474" font-family="system-ui,-apple-system,Segoe UI,sans-serif"><title>Manufacturing flow</title><style>
.o{fill:none;stroke:#f4e9dc;stroke-width:1.4}.t{fill:none;stroke:#ff9a3c;stroke-width:1.2}.h{fill:none;stroke:#b9a99a;stroke-width:1}
.d{stroke:#b9a99a;stroke-width:.8;fill:none}.dt{fill:#b9a99a;font-size:11px}.lb{fill:#f4e9dc;font-size:12px}.ti{fill:#f4e9dc;font-size:16px;font-weight:600}
.sm{fill:#b9a99a;font-size:10px}
</style>
<defs><marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b9a99a"/></marker></defs><rect width="1048" height="474" rx="14" fill="#14110f"/><text class="ti" x="24" y="36">Make it: what to send where</text><text class="sm" x="24" y="54">Every input is an open file in this repository. The PCB is the one blocked step: it must be routed and reviewed before Gerbers exist.</text><rect x="24" y="72" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="38" y="96" fill="#f4e9dc" font-size="14" font-weight="600">1  Buy parts</text><rect x="286.0" y="82" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="324" y="95" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="38" y="118" fill="#b9a99a" font-size="11.5">hardware/BOM.csv: 29 lines, 71 parts</text><text x="38" y="134" fill="#b9a99a" font-size="11.5">hardware/BOM_mechanical.csv</text><text x="38" y="150" fill="#b9a99a" font-size="11.5">safety items: rating or better only</text><rect x="356" y="72" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="370" y="96" fill="#f4e9dc" font-size="14" font-weight="600">2  3D print (PETG)</text><rect x="618.0" y="82" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="656" y="95" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="370" y="118" fill="#b9a99a" font-size="11.5">cad/print/*.3mf plates</text><text x="370" y="134" fill="#b9a99a" font-size="11.5">coupons, then case, floor, 3 rods</text><text x="370" y="150" fill="#b9a99a" font-size="11.5">fits a Bambu Lab P1S (256 mm)</text><rect x="688" y="72" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="702" y="96" fill="#f4e9dc" font-size="14" font-weight="600">3  Laser cut</text><rect x="950.0" y="82" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="988" y="95" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="702" y="118" fill="#b9a99a" font-size="11.5">cad/Window_panel_3mm_1to1.dxf</text><text x="702" y="134" fill="#b9a99a" font-size="11.5">3 mm smoked CAST acrylic</text><text x="702" y="150" fill="#b9a99a" font-size="11.5">206 x 92.8 mm window panel</text><rect x="24" y="204" width="312" height="112" rx="12" fill="#1f1915" stroke="#ff5a3c" stroke-width="2"/><text x="38" y="228" fill="#f4e9dc" font-size="14" font-weight="600">4  PCB fabrication</text><rect x="271.6" y="214" width="54.4" height="18" rx="9" fill="#ff5a3c" opacity=".18"/><text x="324" y="227" fill="#ff5a3c" font-size="10.5" font-weight="700" text-anchor="end">BLOCKED</text><text x="38" y="250" fill="#b9a99a" font-size="11.5">hardware/ KiCad project</text><text x="38" y="266" fill="#b9a99a" font-size="11.5">not routed yet: no Gerbers</text><text x="38" y="282" fill="#b9a99a" font-size="11.5">scripts/make_fab_outputs.sh gate</text><rect x="356" y="204" width="312" height="112" rx="12" fill="#1f1915" stroke="#b9a99a" stroke-width="1.2"/><text x="370" y="228" fill="#f4e9dc" font-size="14" font-weight="600">5  Assemble</text><rect x="589.2" y="214" width="68.8" height="18" rx="9" fill="#b9a99a" opacity=".18"/><text x="656" y="227" fill="#b9a99a" font-size="10.5" font-weight="700" text-anchor="end">AFTER PCB</text><text x="370" y="250" fill="#b9a99a" font-size="11.5">docs/BUILD_GUIDE.md stages 1-4</text><text x="370" y="266" fill="#b9a99a" font-size="11.5">LV first, HV last, one tube first</text><text x="370" y="282" fill="#b9a99a" font-size="11.5">discharge gate every time</text><rect x="688" y="204" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="702" y="228" fill="#f4e9dc" font-size="14" font-weight="600">6  Program</text><rect x="950.0" y="214" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="988" y="227" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="702" y="250" fill="#b9a99a" font-size="11.5">firmware/Nixie_RevC/*.ino</text><text x="702" y="266" fill="#b9a99a" font-size="11.5">or build/Nixie_RevC.hex + avrdude</text><text x="702" y="282" fill="#b9a99a" font-size="11.5">compiles; never run on a board</text><rect x="24" y="336" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="38" y="360" fill="#f4e9dc" font-size="14" font-weight="600">7  Wire and enclose</text><rect x="286.0" y="346" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="324" y="359" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="38" y="382" fill="#b9a99a" font-size="11.5">12 V pigtail + clamp, CR2032</text><text x="38" y="398" fill="#b9a99a" font-size="11.5">neon leads sleeved >=300 V</text><text x="38" y="414" fill="#b9a99a" font-size="11.5">M2 screws only</text><rect x="356" y="336" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="370" y="360" fill="#f4e9dc" font-size="14" font-weight="600">8  Label</text><rect x="618.0" y="346" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="656" y="359" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="370" y="382" fill="#b9a99a" font-size="11.5">docs/labels.pdf (print at 100 %)</text><text x="370" y="398" fill="#b9a99a" font-size="11.5">HV warning + rating plate</text><text x="370" y="414" fill="#b9a99a" font-size="11.5">markers near PS1 and JP1</text><rect x="688" y="336" width="312" height="112" rx="12" fill="#1f1915" stroke="#7fd18b" stroke-width="2"/><text x="702" y="360" fill="#f4e9dc" font-size="14" font-weight="600">9  Test and record</text><rect x="950.0" y="346" width="40.0" height="18" rx="9" fill="#7fd18b" opacity=".18"/><text x="988" y="359" fill="#7fd18b" font-size="10.5" font-weight="700" text-anchor="end">READY</text><text x="702" y="382" fill="#b9a99a" font-size="11.5">hardware/TEST_RECORD.csv</text><text x="702" y="398" fill="#b9a99a" font-size="11.5">PASS / FIX / STOP per step</text><text x="702" y="414" fill="#b9a99a" font-size="11.5">docs/VALIDATION.md</text></svg>