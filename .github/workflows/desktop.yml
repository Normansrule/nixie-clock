# Builds the Nixie Clock Companion desktop app on Windows, macOS and Linux.
# A tag named app-vX.Y.Z (scripts/release_app.sh makes one) publishes the files to a GitHub Release.
# A manual run (workflow_dispatch) only uploads them as workflow artifacts.
name: desktop
on:
  push:
    tags: ["app-v*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build (unsigned)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            app/dist/*.AppImage
            app/dist/*.deb
            app/dist/*.exe
            app/dist/*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/app-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum * > SHA256SUMS-desktop.txt && cat SHA256SUMS-desktop.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          NOTES="Nixie Clock Companion ${TAG#app-v}: offline build guide, calculators and USB serial companion for the Six-Tube Nixie Clock. The clock itself is an UNVALIDATED engineering prototype with about 170 V inside: read docs/SAFETY.md. Builds are not code-signed; see docs/APP.md for first-run steps. Verify downloads with SHA256SUMS-desktop.txt."
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* -R "$REPO" --clobber
          else
            gh release create "$TAG" out/* -R "$REPO" --title "Nixie Clock Companion ${TAG#app-v}" --notes "$NOTES"
          fi
